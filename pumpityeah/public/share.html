<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PumpitYeah</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    .bar { position: sticky; top: 0; z-index: 5; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); font-size: 14px; }
    .bar .logo { font-size: 15px; } .bar .logo img { width: 22px; height: 22px; }
    .crumb { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 12px; flex: 1; }
    .cover { height: 30vh; max-height: 280px; background-size: cover; background-position: center; }
    .wrap { max-width: 708px; margin: 0 auto; padding: 0 24px 120px; }
    .icon { font-size: 72px; line-height: 1.1; margin-top: 64px; }
    .has-cover .icon { margin-top: -40px; position: relative; }
    .has-cover .no-icon { height: 40px; }
    h1.title { font-size: 40px; font-weight: 700; line-height: 1.2; margin: 12px 0 18px; color: var(--text); letter-spacing: -0.01em; }
    .meta { color: var(--text-3); font-size: 13px; margin-bottom: 20px; }
    .content { font-size: 16px; line-height: 1.6; }
    .sb { margin: 2px 0; }
    .sb-p { margin: 0; padding: 3px 2px; min-height: 1.6em; }
    .sb-h1 { font-size: 1.875em; font-weight: 600; margin: 1.4em 0 4px; line-height: 1.3; }
    .sb-h2 { font-size: 1.5em; font-weight: 600; margin: 1.1em 0 4px; line-height: 1.3; }
    .sb-h3 { font-size: 1.25em; font-weight: 600; margin: 0.9em 0 2px; line-height: 1.3; }
    .sb-li { display: flex; gap: 6px; padding: 3px 2px; }
    .sb-dot, .sb-num { min-width: 22px; text-align: center; flex-shrink: 0; }
    .sb-check { width: 16px; height: 16px; border: 1.5px solid currentColor; border-radius: 3px; margin: 4px 4px 0 3px; flex-shrink: 0; display: grid; place-items: center; }
    .sb-todo.done .sb-check { background: var(--blue); border-color: var(--blue); color: #fff; }
    .sb-todo.done > div { text-decoration: line-through; color: var(--text-3); }
    .sb-quote { border-left: 3px solid currentColor; padding-left: 14px; margin: 6px 0; font-size: 1.2em; }
    .sb-callout { display: flex; gap: 10px; background: var(--callout-bg); padding: 16px; border-radius: 6px; margin: 6px 0; }
    .sb-callout > span { font-size: 20px; }
    .sb-hr { border: 0; height: 1px; background: var(--border-2); margin: 14px 0; }
    .sb-code { background: var(--bg-soft); border-radius: 6px; padding: 18px 20px; overflow-x: auto; font-size: 14px; }
    .sb-code code { background: none !important; color: var(--text) !important; padding: 0 !important; }
    .sb-toggle { padding: 3px 2px; } .sb-toggle summary { cursor: pointer; } .sb-toggle > div { padding: 4px 0 4px 22px; }
    .sb-img img { border-radius: 4px; } .sb-img figcaption { color: var(--text-2); font-size: 14px; margin-top: 6px; }
    .sb-img { margin: 8px 0; }
    .sb-pagelink { display: flex; gap: 6px; padding: 4px 2px; text-decoration: none; font-weight: 500; }
    .sb-pagelink .sb-pagelink-title { border-bottom: 1px solid var(--border-2); }
    .sb-pagelink.muted { color: var(--text-3); }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border-bottom: 1px solid var(--border); padding: 8px; text-align: left; }
    th { color: var(--text-2); font-weight: 400; }
    .tbl { overflow-x: auto; }
    .center { text-align: center; padding: 20vh 24px; color: var(--text-2); }
  </style>
</head>
<body>
  <div class="bar"><a class="logo" href="/"><img src="/favicon.svg" alt="">PumpitYeah</a><span class="crumb" id="crumb"></span><a class="btn btn-primary btn-sm" href="/signup">Try PumpitYeah free</a></div>
  <main id="root"><div class="center"><span class="spinner"></span></div></main>
  <script type="module">
    import { renderStaticBlocks, escapeHtml, cssUrl, formatDate } from '/js/common.js';
    const root = document.getElementById('root');
    const id = location.pathname.split('/').pop();
    try {
      const res = await fetch('/api/public/' + encodeURIComponent(id));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      const p = data.page;
      document.title = `${p.icon ? p.icon + ' ' : ''}${p.title || 'Untitled'}`;
      document.getElementById('crumb').textContent = `${p.icon || ''} ${p.title || 'Untitled'}`;
      let cover = '';
      if (p.cover) {
        if (/^(gradient|solid):/.test(p.cover)) cover = `<div class="cover cover-${p.cover.replace(':', '-')}"></div>`;
        else cover = `<div class="cover" style="background-image:${escapeHtml(cssUrl(p.cover))}"></div>`;
      }
      let body = '';
      if (p.kind === 'database') {
        const schema = p.schema || [];
        const cell = (s, v) => v == null || v === '' ? '' : s.type === 'date' ? formatDate(v) : s.type === 'checkbox' ? (v ? '✓' : '') : [].concat(v).map(escapeHtml).join(', ');
        body = `<div class="tbl"><table><thead><tr><th>Name</th>${schema.map((s) => `<th>${escapeHtml(s.name)}</th>`).join('')}</tr></thead><tbody>${
          (p.rows || []).map((r) => `<tr><td><b>${escapeHtml(r.title || 'Untitled')}</b></td>${schema.map((s) => `<td>${cell(s, r.props[s.id])}</td>`).join('')}</tr>`).join('')
        }</tbody></table></div>`;
      } else body = renderStaticBlocks(p.blocks || [], { links: data.links });
      root.innerHTML = `${cover}<div class="wrap ${p.cover ? 'has-cover' : ''}">
        ${p.icon ? `<div class="icon">${escapeHtml(p.icon)}</div>` : '<div class="no-icon"></div>'}
        <h1 class="title">${escapeHtml(p.title || 'Untitled')}</h1>
        <div class="meta">By ${escapeHtml(data.author)} · Updated ${new Date(p.updatedAt).toLocaleDateString()}</div>
        <div class="content rich">${body}</div></div>`;
    } catch (e) {
      root.innerHTML = `<div class="center"><div style="font-size:42px">🔒</div><h2>${escapeHtml(e.message || 'Page not found')}</h2><p><a href="/">Go to PumpitYeah</a></p></div>`;
    }
  </script>
</body>
</html>
