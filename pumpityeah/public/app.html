<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PumpitYeah</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Apply saved theme before paint to avoid a flash
    try { const t = localStorage.getItem('py-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="main-scroll" id="mainScroll">
        <div id="view" class="view">
          <div class="boot"><span class="spinner"></span></div>
        </div>
      </div>
      <button class="ai-fab" id="aiFab" aria-label="Ask PumpitYeah AI" title="Ask PumpitYeah AI"></button>
    </div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
